packages:
  - "*"

# build-script gating
strictDepBuilds: true
allowBuilds:
  esbuild: true
  sharp: true

# supply-chain protection
minimumReleaseAge: 1440
minimumReleaseAgeExclude: []
blockExoticSubdeps: true

# hygiene / DX
savePrefix: ""
verifyDepsBeforeRun: install

overrides:
  "jws": "4.0.1"
  "@aws-sdk/core>fast-xml-parser": "4.5.5"
  "@eslint/eslintrc>minimatch": "3.1.5"
  "@typescript-eslint/typescript-estree>minimatch": "9.0.7"
  "eslint-plugin-import>minimatch": "3.1.5"
  "eslint-plugin-jsx-a11y>minimatch": "3.1.5"
  "eslint-plugin-react>minimatch": "3.1.5"
  "@eslint/eslintrc>ajv": "6.14.0"
  "@eslint/eslintrc>js-yaml": "4.1.1"
  "json-schema-to-typescript>js-yaml": "4.1.1"
  "flat-cache>flatted": "3.4.2"
  "terser-webpack-plugin>serialize-javascript": "7.0.5"
  "vite>rollup": "4.59.0"
  "sass>immutable": "4.3.8"
  "picomatch": "4.0.4"
  "json-schema-to-typescript>lodash": "4.18.0"
  "recharts>lodash": "4.18.0"
  "@payloadcms/payload-cloud>nodemailer": "8.0.4"
  "@payloadcms/email-nodemailer>nodemailer": "8.0.4"
  "@smithy/config-resolver": "4.4.0"
  "http-proxy-agent>@tootallnate/once": "3.0.1"
  "@esbuild-kit/core-utils>esbuild": "0.25.0"
  "cosmiconfig>yaml": "1.10.3"
  "brace-expansion": "2.0.3"
  "webpack": "5.104.1"
